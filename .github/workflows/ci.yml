name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server and site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v1/hub/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the server with its test tools
        run: pip install -e "./v1/hub[test]"
      - name: Server tests
        run: pytest -q -W error
        working-directory: v1/hub
      - name: Site tests
        run: node --test site/tests/*.test.mjs

  test-firmware:
    name: Firmware tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v1/firmware/requirements.txt
      - name: Install ESPHome and pytest
        run: pip install -r v1/firmware/requirements.txt pytest==9.1.1
      - name: Firmware tests
        run: pytest -q v1/firmware/tests
      - name: Version 2 web image tests
        run: pytest -q v2/firmware/tests/test_build_web.py

  build-firmware:
    name: Firmware build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v1/firmware/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('v1/firmware/requirements.txt') }}
          restore-keys: |
            esphome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('v1/firmware/requirements.txt') }}
      - name: Install ESPHome
        run: pip install -r v1/firmware/requirements.txt
      - name: Build the firmware
        run: bash v1/firmware/build-web.sh

  test-v2-core:
    name: Version 2 core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S v2/firmware/tests/host -B v2/firmware/build-host -DPT_REQUIRE_SANITIZERS=ON
      - name: Build
        run: cmake --build v2/firmware/build-host --parallel
      - name: Test
        run: ctest --test-dir v2/firmware/build-host --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Settings page tests
        run: node --test v2/firmware/web/tests/*.test.mjs

  build-v2-firmware:
    name: Version 2 firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Check the ESP-IDF version
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          test "$(idf.py --version)" = "ESP-IDF $(cat v2/firmware/IDF_VERSION)"
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -C v2/firmware build
      - name: Build the web flashing image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          out="$(mktemp -d)"
          version="$(head -n 1 v2/firmware/VERSION | cut -d- -f1)"
          bash v2/firmware/build-web.sh --version "$version" --out "$out/site" --dist "$out/dist"
          bash v2/firmware/build-web.sh --from-factory "$out/dist/pytaichenko.factory.bin" --version "$version" --out "$out/split"
          diff -r "$out/site" "$out/split"
          ls -l "$out/site" "$out/dist"
