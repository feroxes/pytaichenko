  <title id="title">How Pytaichenko works</title>
  <desc id="desc">You ask the speaker out loud. At home the speaker hears the wake phrase by itself and passes your question to voice-hub, your home server with the settings page and your OpenAI key. voice-hub talks to OpenAI Realtime, and the spoken answer comes back the same way.</desc>
