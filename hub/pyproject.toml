[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-hub"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "aioesphomeapi==46.22.0",
    "aiohttp==3.14.5",
    "soxr==1.1.0",
    "numpy==2.5.4",
    "PyYAML==6.0.3",
    "zeroconf==0.151.5",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-aiohttp==1.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_hub = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "devtools/tests"]
pythonpath = [".", "tests"]
