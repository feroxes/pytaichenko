substitutions:
  name: kitchen
  friendly_name: Кухня
esphome:
  name: kitchen
  friendly_name: Кухня
  min_version: 2026.10.0
  on_boot:
    - then:
        - light.turn_on:
            id: led
            effect: Offline
            state: true
        - light.turn_on:
            id: ring
            effect: Offline
            brightness: 0.01
            state: true
      priority: 600.0
  build_path: build/kitchen
  platformio_options: {}
  build_flags: []
  environment_variables: {}
  includes: []
  includes_c: []
  libraries: []
  name_add_mac_suffix: false
  merge_warnings: true
  debug_scheduler: false
  suspend_loop: false
  areas: []
  devices: []
esp32:
  board: esp32doit-devkit-v1
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    version: 5.5.6
    sdkconfig_options: {}
    log_level: ERROR
    advanced:
      compiler_optimization: SIZE
      enable_idf_experimental_features: false
      enable_lwip_assert: true
      ignore_efuse_custom_mac: false
      ignore_efuse_mac_crc: false
      sram1_as_iram: false
      enable_lwip_mdns_queries: true
      enable_lwip_bridge_interface: false
      enable_lwip_tcpip_core_locking: true
      enable_lwip_check_thread_safety: true
      disable_libc_locks_in_iram: true
      disable_vfs_support_termios: true
      disable_vfs_support_select: true
      disable_vfs_support_dir: true
      freertos_in_iram: false
      ringbuf_in_iram: false
      heap_in_iram: false
      execute_from_psram: false
      loop_task_stack_size: 8192
      enable_ota_rollback: true
      enable_ota_downgrade_protection: false
      use_full_certificate_bundle: false
      include_builtin_idf_components: []
      enable_full_printf: false
      disable_debug_stubs: true
      disable_ocd_aware: true
      disable_usb_serial_jtag_secondary: true
      disable_dev_null_vfs: true
      disable_mbedtls_peer_cert: true
      disable_mbedtls_pkcs7: true
      disable_mbedtls_tls: true
      disable_mbedtls_tls_server: true
      disable_mbedtls_tls_extras: true
      disable_regi2c_in_iram: true
      adc_oneshot_in_iram: false
      disable_fatfs: true
    components: []
  flash_size: 4MB
  watchdog_timeout: 5s
  variant: ESP32
logger:
  baud_rate: 115200
  tx_buffer_size: 512
  deassert_rts_dtr: false
  task_log_buffer_size: 768
  hardware_uart: UART0
  level: DEBUG
  logs: {}
  runtime_tag_levels: false
preferences:
  flash_write_interval: 5s
i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: 25
    i2s_bclk_pin: 32
  - id: i2s_spk
    i2s_lrclk_pin: 27
    i2s_bclk_pin: 26
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: 33
    pdm: false
    channel: left
    bits_per_sample: 32
    sample_rate: 16000
    correct_dc_offset: true
    i2s_mode: primary
    use_apll: false
    mclk_multiple: 256
    pdm_dsr: 8
    adc_type: external
    num_channels: 1
    min_bits_per_sample: 32
    max_bits_per_sample: 32
    min_channels: 1
    max_channels: 1
    min_sample_rate: 16000
    max_sample_rate: 16000
speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_spk
    i2s_dout_pin: 22
    channel: mono
    bits_per_sample: 16
    sample_rate: 16000
    buffer_duration: 100ms
    i2s_mode: primary
    use_apll: false
    mclk_multiple: 256
    timeout: 500ms
    i2s_comm_fmt: stand_i2s
    spdif_mode: false
    dac_type: external
    num_channels: 1
    min_bits_per_sample: 16
    max_bits_per_sample: 32
    min_channels: 1
    max_channels: 2
    min_sample_rate: 16000
    max_sample_rate: 48000
media_player:
  - platform: speaker
    id: mp
    name: ''
    announcement_pipeline:
      speaker: spk
      format: WAV
      num_channels: 1
      sample_rate: 16000
    buffer_size: 6000
    volume_initial: 0.7
    files:
      - id: wake_sound
        file:
          path: <config_dir>/sounds/wake.wav
          type: local
      - id: end_sound
        file:
          path: <config_dir>/sounds/end.wav
          type: local
    disabled_by_default: false
    volume_increment: 0.05
    volume_max: 1.0
    volume_min: 0.0
micro_wake_word:
  microphone:
    microphone: mic
    channels:
      - 0
    gain_factor: 4
    bits_per_sample: 16
  id: mww
  vad:
    model:
      url: https://github.com/esphome/micro-wake-word-models.git
      file: models/v2/vad.json
      ref: 40ff33f57f8fc6ad71a75ef085abbf742495b225
      refresh: 1d
      type: git
    internal: false
  models:
    - model:
        url: https://github.com/esphome/micro-wake-word-models.git
        file: models/v2/hey_jarvis.json
        ref: 40ff33f57f8fc6ad71a75ef085abbf742495b225
        refresh: 1d
        type: git
      id: hey_jarvis
      probability_cutoff: 0.85
      internal: false
    - model:
        url: https://github.com/esphome/micro-wake-word-models.git
        file: models/v2/okay_nabu.json
        ref: 40ff33f57f8fc6ad71a75ef085abbf742495b225
        refresh: 1d
        type: git
      id: okay_nabu
      probability_cutoff: 0.8
      internal: false
    - model:
        url: https://github.com/esphome/micro-wake-word-models.git
        file: models/v2/hey_mycroft.json
        ref: 40ff33f57f8fc6ad71a75ef085abbf742495b225
        refresh: 1d
        type: git
      id: hey_mycroft
      probability_cutoff: 0.9
      internal: false
  on_wake_word_detected:
    then:
      - script.execute:
          id: start_listening
          wake_word: !lambda |-
            return wake_word;
  stop_after_detection: true
voice_assistant:
  id: va
  microphone:
    - microphone: mic
      channels:
        - 0
      gain_factor: 4
      bits_per_sample: 16
  media_player: mp
  micro_wake_word: mww
  on_listening:
    then:
      - light.turn_on:
          id: led
          effect: None
          state: true
      - if:
          condition:
            lambda: !lambda |-
              return id(follow_up);
          then:
            - light.turn_on:
                id: ring
                effect: None
                brightness: 0.4
                state: true
          else:
            - light.turn_on:
                id: ring
                effect: None
                brightness: 1.0
                state: true
  on_stt_vad_start:
    then:
      - light.turn_on:
          id: ring
          effect: None
          brightness: 1.0
          state: true
  on_stt_vad_end:
    then:
      - light.turn_on:
          id: led
          effect: Thinking
          state: true
      - light.turn_on:
          id: ring
          effect: Thinking
          state: true
  on_intent_progress:
    then:
      - globals.set:
          id: follow_up
          value: 'true'
      - light.turn_on:
          id: ring
          effect: None
          brightness: 0.7
          state: true
  on_end:
    then:
      - script.execute:
          id: back_to_wake_word
          chime: true
  on_error:
    then:
      - script.execute:
          id: show_error
  on_client_connected:
    then:
      - light.turn_off:
          id: led
          state: false
      - light.turn_off:
          id: ring
          state: false
      - delay: 2s
      - script.execute:
          id: back_to_wake_word
          chime: false
  on_client_disconnected:
    then:
      - micro_wake_word.stop: {}
      - globals.set:
          id: follow_up
          value: 'false'
      - light.turn_on:
          id: led
          effect: Offline
          state: true
      - light.turn_on:
          id: ring
          effect: Offline
          brightness: 0.01
          state: true
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0
  conversation_timeout: 300s
  volume_multiplier: 1.0
globals:
  - id: follow_up
    type: bool
    initial_value: 'false'
    restore_value: false
script:
  - id: toggle_listen
    then:
      - if:
          condition:
            or:
              - voice_assistant.is_running: {}
              - media_player.is_announcing: {}
              - script.is_running:
                  id: start_listening
          then:
            - script.stop:
                id: start_listening
            - voice_assistant.stop: {}
            - if:
                condition:
                  media_player.is_announcing: {}
                then:
                  - media_player.stop:
                      id: mp
                      announcement: false
            - script.execute:
                id: back_to_wake_word
                chime: true
          else:
            - if:
                condition:
                  voice_assistant.connected: {}
                then:
                  - micro_wake_word.stop: {}
                  - script.execute:
                      id: start_listening
                      wake_word: ''
    mode: single
    parameters: {}
  - id: start_listening
    parameters:
      wake_word: string
    then:
      - globals.set:
          id: follow_up
          value: 'false'
      - light.turn_on:
          id: led
          effect: None
          state: true
      - light.turn_on:
          id: ring
          effect: None
          brightness: 1.0
          state: true
      - media_player.speaker.play_on_device_media_file:
          media_file: wake_sound
          announcement: true
          enqueue: false
      - wait_until:
          condition:
            media_player.is_announcing: {}
          timeout: 300ms
      - wait_until:
          condition:
            not:
              media_player.is_announcing: {}
          timeout: 1500ms
      - delay: 100ms
      - if:
          condition:
            voice_assistant.connected: {}
          then:
            - voice_assistant.start:
                wake_word: !lambda |-
                  return wake_word;
                silence_detection: true
          else:
            - light.turn_on:
                id: led
                effect: Offline
                state: true
            - light.turn_on:
                id: ring
                effect: Offline
                brightness: 0.01
                state: true
    mode: single
  - id: show_error
    mode: restart
    then:
      - light.turn_on:
          id: led
          effect: Error
          state: true
      - light.turn_off:
          id: ring
          transition_length: 0s
          state: false
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: ring
                brightness: 1.0
                transition_length: 200ms
                state: true
            - delay: 200ms
            - light.turn_off:
                id: ring
                transition_length: 250ms
                state: false
            - delay: 250ms
      - delay: 1650ms
      - if:
          condition:
            voice_assistant.connected: {}
          then:
            - light.turn_off:
                id: led
                state: false
          else:
            - light.turn_on:
                id: led
                effect: Offline
                state: true
            - light.turn_on:
                id: ring
                effect: Offline
                brightness: 0.01
                state: true
      - if:
          condition:
            and:
              - not:
                  script.is_running:
                    id: back_to_wake_word
              - not:
                  micro_wake_word.is_running: {}
          then:
            - script.execute:
                id: back_to_wake_word
                chime: true
    parameters: {}
  - id: back_to_wake_word
    mode: restart
    parameters:
      chime: bool
    then:
      - wait_until:
          condition:
            media_player.is_announcing: {}
          timeout: 500ms
      - wait_until:
          condition:
            and:
              - not:
                  voice_assistant.is_running: {}
              - not:
                  media_player.is_announcing: {}
      - globals.set:
          id: follow_up
          value: 'false'
      - if:
          condition:
            voice_assistant.connected: {}
          then:
            - if:
                condition:
                  not:
                    script.is_running:
                      id: show_error
                then:
                  - light.turn_off:
                      id: led
                      state: false
                  - light.turn_off:
                      id: ring
                      state: false
            - if:
                condition:
                  lambda: !lambda |-
                    return chime;
                then:
                  - media_player.speaker.play_on_device_media_file:
                      media_file: end_sound
                      announcement: true
                      enqueue: false
                  - wait_until:
                      condition:
                        media_player.is_announcing: {}
                      timeout: 300ms
                  - wait_until:
                      condition:
                        not:
                          media_player.is_announcing: {}
                      timeout: 1500ms
            - if:
                condition:
                  and:
                    - voice_assistant.connected: {}
                    - not:
                        micro_wake_word.is_running: {}
                then:
                  - micro_wake_word.start: {}
output:
  - platform: gpio
    pin:
      number: 2
      mode:
        output: true
        input: false
        open_drain: false
        pullup: false
        pulldown: false
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    id: led_out
  - platform: ledc
    id: ring_out
    pin:
      number: 4
      drive_strength: 40.0
      mode:
        output: true
        input: false
        open_drain: false
        pullup: false
        pulldown: false
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
    frequency: 25000.0
    min_power: 0.03
    zero_means_zero: true
light:
  - platform: binary
    id: led
    output: led_out
    internal: true
    effects:
      - strobe:
          name: Thinking
          colors:
            - state: true
              duration: 600ms
              brightness: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
            - state: false
              duration: 600ms
              brightness: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
      - strobe:
          name: Error
          colors:
            - state: true
              duration: 100ms
              brightness: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
            - state: false
              duration: 100ms
              brightness: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
      - strobe:
          name: Offline
          colors:
            - state: true
              duration: 100ms
              brightness: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
            - state: false
              duration: 900ms
              brightness: 1.0
              white: 1.0
              cold_white: 1.0
              warm_white: 1.0
              transition_length: 0s
              color_brightness: 1.0
              red: 1.0
              green: 1.0
              blue: 1.0
    disabled_by_default: false
    resume_effect: false
    name: led
  - platform: monochromatic
    id: ring
    output: ring_out
    internal: true
    restore_mode: ALWAYS_OFF
    default_transition_length: 400ms
    effects:
      - pulse:
          name: Thinking
          transition_length: 1200ms
          update_interval: 1200ms
          min_brightness: 0.2
          max_brightness: 0.8
      - pulse:
          name: Offline
          transition_length: 2s
          update_interval: 2s
          min_brightness: 0.0
          max_brightness: 0.7
    disabled_by_default: false
    resume_effect: false
    gamma_correct: 2.8
    flash_transition_length: 0s
    name: ring
binary_sensor:
  - platform: gpio
    id: boot_button
    pin:
      number: 0
      inverted: true
      mode:
        input: true
        pullup: true
        output: false
        open_drain: false
        pulldown: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    filters:
      - delayed_on: 30ms
    on_press:
      - then:
          - script.execute:
              id: toggle_listen
    disabled_by_default: false
    use_interrupt: true
    interrupt_type: ANY
    name: boot_button
    internal: true
  - platform: gpio
    id: top_button
    pin:
      number: 19
      inverted: true
      mode:
        input: true
        pullup: true
        output: false
        open_drain: false
        pulldown: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    filters:
      - delayed_on: 30ms
    on_press:
      - then:
          - script.execute:
              id: toggle_listen
    disabled_by_default: false
    use_interrupt: true
    interrupt_type: ANY
    name: top_button
    internal: true
button:
  - platform: template
    name: Listen
    on_press:
      - then:
          - script.execute:
              id: toggle_listen
    disabled_by_default: false
debug:
  update_interval: 30s
sensor:
  - platform: debug
    free:
      name: Heap free
      disabled_by_default: false
      force_update: false
      unit_of_measurement: B
      icon: mdi:counter
      accuracy_decimals: 0
      state_class: measurement
      entity_category: diagnostic
    block:
      name: Heap max block
      disabled_by_default: false
      force_update: false
      unit_of_measurement: B
      icon: mdi:counter
      accuracy_decimals: 0
      state_class: measurement
      entity_category: diagnostic
mdns:
  disabled: true
  services: []
wifi:
  domain: .local
  reboot_timeout: 15min
  power_save_mode: LIGHT
  fast_connect:
    enabled: false
    storage: flash
  enable_btm: false
  enable_rrm: false
  passive_scan: false
  enable_on_boot: true
  post_connect_roaming: true
  min_auth_mode: WPA2
  networks:
    - ssid: !secret 'wifi_ssid'
      password: !secret 'wifi_password'
      priority: 0
  use_address: kitchen.local
api:
  encryption:
    key: !secret 'kitchen_api_key'
  port: 6053
  reboot_timeout: 15min
  batch_delay: 100ms
  custom_services: false
  homeassistant_services: false
  homeassistant_states: false
  listen_backlog: 4
  max_connections: 5
  max_send_queue: 8
ota:
  - platform: esphome
    password: !secret 'kitchen_ota_password'
    version: 2
    port: 3232
    allow_partition_access: false

