name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish the site from again, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the versions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: The tag equals the firmware, server and site versions
        run: bash .github/scripts/check-version.sh "$TAG"
      - name: CHANGELOG.md has notes for this version
        run: bash .github/scripts/release-notes.sh "${TAG#v}" > /dev/null
      - id: version
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: [check, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/requirements.txt') }}
          restore-keys: |
            esphome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/requirements.txt') }}
      - name: Install ESPHome
        run: pip install -r firmware/requirements.txt
      - name: Build the firmware
        run: bash firmware/build-web.sh
      - name: Pack the release files
        run: |
          mkdir -p dist
          cp site/firmware/pytaichenko.factory.bin "dist/pytaichenko-$VERSION.factory.bin"
          zip -j "dist/pytaichenko-$VERSION-stl.zip" case/stl/*.stl LICENSE-hardware
          bash .github/scripts/release-notes.sh "$VERSION" > dist/notes.md
      - name: Create the GitHub Release
        run: >-
          gh release create "$TAG"
          "dist/pytaichenko-$VERSION.factory.bin"
          "dist/pytaichenko-$VERSION-stl.zip"
          --verify-tag
          --title "Pytaichenko $VERSION"
          --notes-file dist/notes.md

  site:
    name: GitHub Pages
    needs: [check, release]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' &&
      (needs.release.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.check.outputs.tag }}
      - name: Publish only the latest release
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::$TAG is not the latest release ($latest is), so the site was not published from it"
            exit 1
          fi
      - name: Take the firmware and the STL archive from the release
        run: |
          gh release download "$TAG" --dir dist --pattern "pytaichenko-$VERSION.factory.bin" --pattern "pytaichenko-$VERSION-stl.zip"
          mkdir -p site/firmware site/files
          cp "dist/pytaichenko-$VERSION.factory.bin" site/firmware/pytaichenko.factory.bin
          cp "dist/pytaichenko-$VERSION-stl.zip" site/files/pytaichenko-stl.zip
      - name: Write the web installer manifest
        run: bash firmware/build-web.sh --manifest-only
      - name: Leave the test sources out of the published site
        run: rm -rf site/tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
