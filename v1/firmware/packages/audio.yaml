i2s_audio:
  - {id: i2s_mic, i2s_lrclk_pin: GPIO25, i2s_bclk_pin: GPIO32}
  - {id: i2s_spk, i2s_lrclk_pin: GPIO27, i2s_bclk_pin: GPIO26}
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO33
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000
    correct_dc_offset: true
speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_spk
    i2s_dout_pin: GPIO22
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 16000
    buffer_duration: 100ms
media_player:
  - platform: speaker
    id: mp
    name: None
    announcement_pipeline: {speaker: spk, format: WAV}
    buffer_size: 6000
    volume_initial: 0.7
    files:
      - {id: wake_sound, file: sounds/wake.wav}
      - {id: end_sound, file: sounds/end.wav}
