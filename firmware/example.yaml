substitutions:
  name: kitchen
  friendly_name: Кухня
packages:
  base: !include packages/base.yaml
  audio: !include packages/audio.yaml
  wake_word: !include packages/wake_word.yaml
  assistant: !include packages/assistant.yaml
  ring: !include packages/ring.yaml
  buttons: !include packages/buttons.yaml
  diagnostics: !include packages/diagnostics.yaml
mdns:
  disabled: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
  encryption:
    key: !secret kitchen_api_key
ota:
  - platform: esphome
    password: !secret kitchen_ota_password
