name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server and site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hub/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the server with its test tools
        run: pip install -e "./hub[test]"
      - name: Server tests
        run: pytest -q -W error
        working-directory: hub
      - name: Site tests
        run: node --test site/tests/*.test.mjs

  test-firmware:
    name: Firmware tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - name: Install ESPHome and pytest
        run: pip install -r firmware/requirements.txt pytest==9.1.1
      - name: Firmware tests
        run: pytest -q firmware/tests

  build-firmware:
    name: Firmware build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/requirements.txt') }}
          restore-keys: |
            esphome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/requirements.txt') }}
      - name: Install ESPHome
        run: pip install -r firmware/requirements.txt
      - name: Build the firmware
        run: bash firmware/build-web.sh
